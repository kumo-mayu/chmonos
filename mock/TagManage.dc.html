<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Zen Kaku Gothic New', 'Yu Gothic UI', 'Meiryo', system-ui, sans-serif; color: #1c1f26; background: #f2f3f5; }
    a { color: #3767a6; text-decoration: none; }
    a:hover { color: #28507f; }
  </style>
</helmet>

<div style="width: 1440px; height: 820px; background: #f2f3f5; display: flex; flex-direction: column; overflow: hidden;">

  <div style="height: 60px; flex-shrink: 0; background: #fff; border-bottom: 1px solid #e2e4e9; display: flex; align-items: center; gap: 14px; padding: 0 24px;">
    <div style="font-size: 16px; font-weight: 700;">タグの管理</div>
    <div style="font-size: 12px; color: #9aa1ae;">appTag のマスタ（トップレベルとサブレベル）を編集します</div>
    <div style="margin-left: auto; font-size: 11px; color: #9aa1ae; font-family: 'JetBrains Mono', Consolas, monospace;">appTags.json</div>
  </div>

  <div style="flex-grow: 1; display: flex; overflow: hidden;">

    <!-- left: top level list -->
    <div style="width: 340px; flex-shrink: 0; background: #fff; border-right: 1px solid #e2e4e9; display: flex; flex-direction: column; overflow: hidden;">
      <div style="padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid #e2e4e9;">
        <div style="height: 32px; border: 1px solid #cdd0d8; border-radius: 6px; display: flex; align-items: center; gap: 8px; padding: 0 10px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6a7180" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
          <span style="font-size: 12.5px; color: #9aa1ae;">タグを検索</span>
        </div>
        <div style="display: flex; align-items: center; justify-content: center; gap: 7px; height: 32px; border-radius: 6px; background: #3767a6; color: #fff; font-size: 12.5px; font-weight: 500;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
          トップレベルを追加
        </div>
      </div>

      <div style="flex-grow: 1; overflow: hidden;">
        <sc-for list="{{tops}}" as="t" hint-placeholder-count="6">
          <div style="display: flex; align-items: center; gap: 10px; padding: 13px 16px; border-bottom: 1px solid #f0f1f4; background: {{t.bg}}; border-left: {{t.marker}};">
            <div style="display: flex; flex-direction: column; gap: 3px;">
              <div style="font-size: 13.5px; font-weight: {{t.weight}};">{{t.name}}</div>
              <div style="font-size: 11px; color: #9aa1ae;">サブ {{t.subCount}} 件</div>
            </div>
            <div style="margin-left: auto; font-size: 12px; color: #6a7180; font-family: 'JetBrains Mono', Consolas, monospace;">{{t.itemCount}}</div>
          </div>
        </sc-for>
      </div>
    </div>

    <!-- right: detail -->
    <div style="flex-grow: 1; padding: 20px 24px; display: flex; flex-direction: column; gap: 18px; overflow: hidden;">

      <div style="background: #fff; border: 1px solid #e2e4e9; border-radius: 8px; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px;">
        <div style="display: flex; align-items: center; gap: 12px;">
          <div style="font-size: 11px; letter-spacing: .08em; color: #6a7180; font-weight: 700;">トップレベル</div>
          <div style="margin-left: auto; display: flex; gap: 8px;">
            <div style="height: 28px; padding: 0 11px; border-radius: 6px; border: 1px solid #cdd0d8; font-size: 12px; display: flex; align-items: center; gap: 6px; color: #454b57;">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4l10-10-4-4L4 16z"></path></svg>
              名前を変更
              <span style="font-size: 10.5px; color: #9aa1ae;">412件を更新</span>
            </div>
            <div style="height: 28px; padding: 0 11px; border-radius: 6px; border: 1px solid #eecccc; color: #9a3232; font-size: 12px; display: flex; align-items: center; gap: 6px;">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14"></path><path d="M9 7V5h6v2"></path><path d="M7 7l1 13h8l1-13"></path></svg>
              削除
            </div>
          </div>
        </div>
        <div style="font-size: 24px; font-weight: 700;">衣装</div>
        <div style="display: flex; flex-direction: column; gap: 7px;">
          <div style="font-size: 11px; letter-spacing: .08em; color: #6a7180; font-weight: 700;">メモ</div>
          <div style="font-size: 12.5px; line-height: 1.75; color: #454b57; background: #fafafb; border: 1px solid #f0f1f4; border-radius: 6px; padding: 10px 12px;">アバターに着せるもの全般。アクセサリ類は「小物」に入れる。素体そのものは「アバター」。</div>
        </div>
      </div>

      <div style="flex-grow: 1; background: #fff; border: 1px solid #e2e4e9; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column;">
        <div style="padding: 13px 20px; border-bottom: 1px solid #e2e4e9; display: flex; align-items: center; gap: 12px;">
          <div style="font-size: 13px; font-weight: 700;">サブレベル</div>
          <div style="font-size: 11px; color: #9aa1ae;">5 件</div>
          <div style="margin-left: auto; height: 28px; padding: 0 11px; border-radius: 6px; border: 1px dashed #cdd0d8; color: #6a7180; font-size: 12px; display: flex; align-items: center; gap: 6px;">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
            サブレベルを追加
          </div>
        </div>

        <sc-for list="{{subs}}" as="s" hint-placeholder-count="5">
          <div style="display: flex; align-items: center; gap: 14px; padding: 13px 20px; border-bottom: 1px solid #f0f1f4;">
            <div style="width: 120px; flex-shrink: 0; font-size: 13px; font-weight: 500;">{{s.name}}</div>
            <div style="flex-grow: 1; font-size: 12px; color: {{s.memoColor}};">{{s.memo}}</div>
            <div style="width: 52px; flex-shrink: 0; text-align: right; font-size: 12px; color: #6a7180; font-family: 'JetBrains Mono', Consolas, monospace;">{{s.count}}</div>
            <div style="display: flex; gap: 5px; flex-shrink: 0;">
              <div style="width: 26px; height: 26px; border-radius: 5px; border: 1px solid #e2e4e9; display: flex; align-items: center; justify-content: center;">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#6a7180" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4l10-10-4-4L4 16z"></path></svg>
              </div>
              <div style="width: 26px; height: 26px; border-radius: 5px; border: 1px solid #e2e4e9; display: flex; align-items: center; justify-content: center;">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#b98c8c" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14"></path><path d="M9 7V5h6v2"></path><path d="M7 7l1 13h8l1-13"></path></svg>
              </div>
            </div>
          </div>
        </sc-for>
      </div>

    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":1440,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    function top(name, subCount, itemCount, active) {
      return {
        name: name,
        subCount: subCount,
        itemCount: itemCount,
        bg: active ? '#eaf0f9' : '#fff',
        marker: active ? '3px solid #3767a6' : '3px solid transparent',
        weight: active ? '700' : '400'
      };
    }
    function sub(name, memo, count) {
      return {
        name: name,
        memo: memo || 'メモなし',
        memoColor: memo ? '#454b57' : '#c2c7d0',
        count: count
      };
    }
    return {
      tops: [
        top('衣装', 5, 412, true),
        top('小物', 5, 288, false),
        top('アバター', 3, 34, false),
        top('テクスチャ', 3, 96, false),
        top('ツール', 3, 61, false),
        top('ワールド', 2, 18, false)
      ],
      subs: [
        sub('トップス', '上半身のみのもの。セットに含まれる場合はセット側に入れる', 124),
        sub('ボトムス', '', 88),
        sub('セット', '上下・小物までまとまっているもの', 96),
        sub('足元', '靴・靴下・タイツ', 71),
        sub('ニット', '素材で分けたい時用。他のサブと併用してよい', 33)
      ]
    };
  }
}
</script>
</body>
</html>
