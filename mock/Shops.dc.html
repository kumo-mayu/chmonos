<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Zen Kaku Gothic New', 'Yu Gothic UI', 'Meiryo', system-ui, sans-serif; color: #1c1f26; background: #f2f3f5; }
    a { color: #3767a6; text-decoration: none; }
    a:hover { color: #28507f; }
  </style>
</helmet>

<div style="width: 1440px; height: 900px; display: flex; background: #f2f3f5; overflow: hidden;">

  <div style="width: 208px; flex-shrink: 0; background: #22262e; color: #cfd4dd; display: flex; flex-direction: column; padding: 16px 0;">
    <div style="padding: 0 18px 14px; display: flex; flex-direction: column; gap: 2px;">
      <div style="font-size: 13px; font-weight: 700; color: #fff;">BOOTH Asset Manager</div>
      <div style="font-size: 11px; color: #767f8e;">1,284 items / 312 shops</div>
    </div>
    <div style="display: flex; flex-direction: column; padding: 0 10px;">
      <div style="font-size: 10px; color: #5d6675; padding: 8px 12px 4px; letter-spacing: .08em;">ライブラリ</div>
      <div style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 12px; border-radius: 6px; font-size: 12.5px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>検索</div>
      <div style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 12px; border-radius: 6px; background: #313745; color: #fff; font-size: 12.5px; font-weight: 500;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h16v11H4z"></path><path d="M4 9l1.5-5h13L20 9"></path></svg>ショップ</div>
      <div style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 12px; border-radius: 6px; font-size: 12.5px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 19V11M12 19V5M19 19v-5"></path></svg>統計</div>

      <div style="font-size: 10px; color: #5d6675; padding: 12px 12px 4px; letter-spacing: .08em;">作業</div>
      <div style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 12px; border-radius: 6px; font-size: 12.5px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"></path><path d="M8 11l4 4 4-4"></path><path d="M5 19h14"></path></svg>取り込み</div>
      <div style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 12px; border-radius: 6px; font-size: 12.5px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M9.6 9.6a2.5 2.5 0 114 2c-.8.6-1.6 1-1.6 2"></path><path d="M12 17.2v.1"></path></svg>未確定<span style="margin-left: auto; font-size: 11px; font-weight: 700; background: #9a6b1f; color: #fff; border-radius: 999px; padding: 1px 7px;">34</span></div>
      <div style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 12px; border-radius: 6px; font-size: 12.5px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15v-4a6 6 0 10-12 0v4l-2 3h16z"></path><path d="M10 21h4"></path></svg>要確認<span style="margin-left: auto; font-size: 11px; font-weight: 700; background: #3767a6; color: #fff; border-radius: 999px; padding: 1px 7px;">6</span></div>
      <div style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 12px; border-radius: 6px; font-size: 12.5px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4l10-10-4-4L4 16z"></path></svg>編集<span style="margin-left: auto; font-size: 11px; font-weight: 700; background: #9a6b1f; color: #fff; border-radius: 999px; padding: 1px 7px;">7</span></div>

      <div style="font-size: 10px; color: #5d6675; padding: 12px 12px 4px; letter-spacing: .08em;">管理</div>
      <div style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 12px; border-radius: 6px; font-size: 12.5px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.4"></circle><path d="M5 20c1-3.6 3.7-5.4 7-5.4S18 16.4 19 20"></path></svg>アバター</div>
      <div style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 12px; border-radius: 6px; font-size: 12.5px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12V5h7l8 8-7 7-8-8z"></path><circle cx="8.5" cy="8.5" r="1.3"></circle></svg>タグの管理</div>
      <div style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 12px; border-radius: 6px; font-size: 12.5px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h14"></path></svg>属性の管理</div>
    </div>
    <div style="margin-top: auto; padding: 0 10px;">
      <div style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 12px; border-radius: 6px; font-size: 12.5px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"></circle><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"></path></svg>設定</div>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; overflow: hidden;">

    <div style="height: 60px; flex-shrink: 0; background: #fff; border-bottom: 1px solid #e2e4e9; display: flex; align-items: center; gap: 12px; padding: 0 24px;">
      <div style="font-size: 16px; font-weight: 700;">ショップ</div>
      <div style="font-size: 12px; color: #9aa1ae;">312 ショップ</div>
      <div style="margin-left: auto; display: flex; align-items: center; gap: 8px;">
        <div style="width: 240px; height: 32px; border: 1px solid #cdd0d8; border-radius: 6px; display: flex; align-items: center; gap: 8px; padding: 0 10px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6a7180" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
          <span style="font-size: 12.5px; color: #9aa1ae;">ショップ名で検索</span>
        </div>
        <div style="height: 32px; border: 1px solid #cdd0d8; border-radius: 6px; display: flex; align-items: center; gap: 8px; padding: 0 11px; font-size: 12px;">
          <span style="color: #6a7180;">並び替え</span>
          所持件数
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#6a7180" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"></path></svg>
        </div>
      </div>
    </div>

    <div style="flex-grow: 1; padding: 18px 24px; overflow: hidden;">
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px;">
        <sc-for list="{{shops}}" as="s" hint-placeholder-count="12">
          <div style="background: #fff; border: 1px solid #e2e4e9; border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 13px;">
            <div style="display: flex; align-items: center; gap: 11px;">
              <div style="width: 42px; height: 42px; border-radius: 8px; background: {{s.thumb}}; flex-shrink: 0;"></div>
              <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0;">
                <div style="font-size: 13px; font-weight: 500;">{{s.name}}</div>
                <div style="font-size: 10.5px; color: #9aa1ae; font-family: 'JetBrains Mono', Consolas, monospace;">{{s.domain}}</div>
              </div>
            </div>

            <div style="display: flex; gap: 14px; padding-top: 11px; border-top: 1px solid #f0f1f4;">
              <div style="display: flex; flex-direction: column; gap: 2px;">
                <div style="font-size: 10px; color: #6a7180; letter-spacing: .04em;">所持</div>
                <div style="font-size: 15px; font-weight: 700; font-family: 'JetBrains Mono', Consolas, monospace;">{{s.count}}</div>
              </div>
              <div style="display: flex; flex-direction: column; gap: 2px;">
                <div style="font-size: 10px; color: #6a7180; letter-spacing: .04em;">支出</div>
                <div style="font-size: 15px; font-weight: 700; font-family: 'JetBrains Mono', Consolas, monospace;">{{s.amount}}</div>
              </div>
              <div style="margin-left: auto; display: flex; flex-direction: column; gap: 2px; align-items: flex-end;">
                <div style="font-size: 10px; color: #6a7180; letter-spacing: .04em;">最終購入</div>
                <div style="font-size: 11.5px; color: #454b57; font-family: 'JetBrains Mono', Consolas, monospace; padding-top: 3px;">{{s.last}}</div>
              </div>
            </div>

            <sc-if value="{{s.hasUpdate}}" hint-placeholder-val="{{ true }}">
              <div style="display: flex; align-items: center; gap: 7px; background: #f7faff; border: 1px solid #dbe4f0; border-radius: 6px; padding: 7px 9px;">
                <span style="width: 6px; height: 6px; border-radius: 999px; background: #3767a6;"></span>
                <span style="font-size: 11px; color: #28507f;">更新のあった商品が {{s.updateCount}} 件</span>
              </div>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    function shop(name, domain, count, amount, last, thumb, updateCount) {
      return {
        name: name, domain: domain, count: count, amount: amount, last: last, thumb: thumb,
        hasUpdate: updateCount > 0, updateCount: updateCount
      };
    }
    return {
      shops: [
        shop('mochi works', 'mochiworks.booth.pm', 21, '¥14,600', '2026-08-30', '#e7f0ec', 0),
        shop('kotori shop', 'kotorishop.booth.pm', 16, '¥21,800', '2026-09-02', '#f2e9ee', 1),
        shop('AtelierNico', 'ateliernico.booth.pm', 12, '¥28,400', '2026-08-16', '#e9edf4', 1),
        shop('STUDIO KOMOREBI', 'komorebi.booth.pm', 9, '¥18,200', '2026-07-19', '#eceaf2', 0),
        shop('HARDLINE', 'hardline.booth.pm', 7, '¥11,900', '2026-06-08', '#eaebee', 0),
        shop('Piyo_crafts', 'piyocrafts.booth.pm', 5, '¥8,300', '2026-05-21', '#f3eee7', 0),
        shop('lilLab', 'lilxyzw.booth.pm', 4, '¥0', '2026-04-30', '#eef0f2', 0),
        shop('BekoShop', 'bekoshop.booth.pm', 4, '¥6,200', '2026-04-11', '#e9ece9', 0),
        shop('FUKA', 'fuka.booth.pm', 3, '¥5,400', '2026-03-25', '#f0ece7', 0),
        shop('TinmeshiTei', 'tinmeshi.booth.pm', 3, '¥4,800', '2026-02-14', '#eeeaf4', 0),
        shop('SHOP HEILON', 'heilon.booth.pm', 2, '¥3,600', '2026-01-08', '#e7e9ee', 0),
        shop('Kaerimichi', 'kaerimichi.booth.pm', 2, '¥3,200', '2025-12-19', '#f0e9ea', 0)
      ]
    };
  }
}
</script>
</body>
</html>
