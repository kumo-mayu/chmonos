<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Zen Kaku Gothic New', 'Yu Gothic UI', 'Meiryo', system-ui, sans-serif; color: #1c1f26; background: #f2f3f5; }
    a { color: #3767a6; text-decoration: none; }
    a:hover { color: #28507f; }
  </style>
</helmet>

<div style="width: 1440px; height: 760px; background: #f2f3f5; display: flex; flex-direction: column; overflow: hidden;">

  <div style="height: 60px; flex-shrink: 0; background: #fff; border-bottom: 1px solid #e2e4e9; display: flex; align-items: center; gap: 14px; padding: 0 24px;">
    <div style="font-size: 16px; font-weight: 700;">属性の管理</div>
    <div style="font-size: 12px; color: #9aa1ae;">属性は 0-100% の連続値。表記ゆれは統合して1つにまとめられます</div>
    <div style="margin-left: auto; display: flex; gap: 8px;">
      <div style="height: 32px; padding: 0 14px; border-radius: 6px; background: #3767a6; color: #fff; font-size: 12.5px; font-weight: 500; display: flex; align-items: center; gap: 7px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
        属性を追加
      </div>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; gap: 20px; padding: 20px 24px; overflow: hidden;">

    <!-- table -->
    <div style="flex-grow: 1; background: #fff; border: 1px solid #e2e4e9; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column;">
      <div style="display: flex; align-items: center; gap: 14px; padding: 11px 20px; border-bottom: 1px solid #e2e4e9; background: #fafafb;">
        <div style="width: 26px; flex-shrink: 0;"></div>
        <div style="width: 180px; flex-shrink: 0; font-size: 11px; letter-spacing: .06em; color: #6a7180; font-weight: 700;">属性名</div>
        <div style="width: 80px; flex-shrink: 0; font-size: 11px; letter-spacing: .06em; color: #6a7180; font-weight: 700; text-align: right;">使用件数</div>
        <div style="width: 240px; flex-shrink: 0; font-size: 11px; letter-spacing: .06em; color: #6a7180; font-weight: 700;">値の分布（平均）</div>
        <div style="flex-grow: 1; font-size: 11px; letter-spacing: .06em; color: #6a7180; font-weight: 700;">メモ</div>
        <div style="width: 60px; flex-shrink: 0;"></div>
      </div>

      <sc-for list="{{attrs}}" as="a" hint-placeholder-count="7">
        <div style="display: flex; align-items: center; gap: 14px; padding: 12px 20px; border-bottom: 1px solid #f0f1f4; background: {{a.rowBg}};">
          <div style="width: 26px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;">
            <span style="width: 16px; height: 16px; border-radius: 4px; border: {{a.boxBorder}}; background: {{a.boxBg}}; display: flex; align-items: center; justify-content: center;">
              <sc-if value="{{a.checked}}" hint-placeholder-val="{{ true }}">
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>
              </sc-if>
            </span>
          </div>
          <div style="width: 180px; flex-shrink: 0; display: flex; align-items: center; gap: 7px;">
            <span style="font-size: 13px; font-weight: 500;">{{a.name}}</span>
            <sc-if value="{{a.hasWarn}}" hint-placeholder-val="{{ true }}">
              <span style="display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: 4px; font-size: 9.5px; background: #fbf1de; color: #8a5f1a; border: 1px solid #eddcbb; white-space: nowrap;">重複の可能性</span>
            </sc-if>
          </div>
          <div style="width: 80px; flex-shrink: 0; font-size: 12.5px; text-align: right; font-family: 'JetBrains Mono', Consolas, monospace; color: #454b57;">{{a.count}}</div>
          <div style="width: 240px; flex-shrink: 0; display: flex; align-items: center; gap: 10px;">
            <div style="flex-grow: 1; height: 8px; background: #f0f1f4; border-radius: 4px; overflow: hidden;">
              <div style="width: {{a.avgPct}}; height: 100%; background: #3767a6; border-radius: 4px;"></div>
            </div>
            <div style="width: 30px; font-size: 11px; text-align: right; font-family: 'JetBrains Mono', Consolas, monospace; color: #6a7180;">{{a.avg}}</div>
          </div>
          <div style="flex-grow: 1; font-size: 11.5px; color: {{a.memoColor}}; line-height: 1.5;">{{a.memo}}</div>
          <div style="width: 60px; flex-shrink: 0; display: flex; justify-content: flex-end; gap: 5px;">
            <div style="width: 26px; height: 26px; border-radius: 5px; border: 1px solid #e2e4e9; display: flex; align-items: center; justify-content: center;">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#6a7180" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4l10-10-4-4L4 16z"></path></svg>
            </div>
            <div style="width: 26px; height: 26px; border-radius: 5px; border: 1px solid #e2e4e9; display: flex; align-items: center; justify-content: center;">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#b98c8c" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14"></path><path d="M9 7V5h6v2"></path><path d="M7 7l1 13h8l1-13"></path></svg>
            </div>
          </div>
        </div>
      </sc-for>
    </div>

    <!-- merge panel -->
    <div style="width: 330px; flex-shrink: 0; display: flex; flex-direction: column; gap: 14px;">
      <div style="background: #fff; border: 1px solid #3767a6; border-radius: 8px; padding: 16px 18px; display: flex; flex-direction: column; gap: 14px;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#3767a6" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v6a4 4 0 004 4h6"></path><path d="M14 11l3 3-3 3"></path><path d="M7 20v-4"></path></svg>
          <div style="font-size: 13px; font-weight: 700;">属性の統合</div>
        </div>

        <div style="font-size: 12px; line-height: 1.7; color: #454b57;">2 件を選択中。統合すると、片方の属性が付いた item はもう片方に置き換わります。</div>

        <div style="display: flex; flex-direction: column; gap: 8px;">
          <div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid #e2e4e9; border-radius: 6px; background: #fafafb;">
            <div style="display: flex; flex-direction: column; gap: 2px;">
              <div style="font-size: 12.5px; font-weight: 500;">可愛い</div>
              <div style="font-size: 11px; color: #9aa1ae; font-family: 'JetBrains Mono', Consolas, monospace;">34 件</div>
            </div>
            <div style="margin-left: auto; font-size: 11px; color: #9a3232;">統合元</div>
          </div>

          <div style="display: flex; justify-content: center;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6a7180" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v13"></path><path d="M6 12l6 6 6-6"></path></svg>
          </div>

          <div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid #c6d6ec; border-radius: 6px; background: #eaf0f9;">
            <div style="display: flex; flex-direction: column; gap: 2px;">
              <div style="font-size: 12.5px; font-weight: 700; color: #28507f;">かわいい</div>
              <div style="font-size: 11px; color: #6a7180; font-family: 'JetBrains Mono', Consolas, monospace;">218 件</div>
            </div>
            <div style="margin-left: auto; font-size: 11px; color: #28507f;">統合先</div>
          </div>
        </div>

        <div style="font-size: 11.5px; line-height: 1.7; color: #6a7180; background: #fafafb; border: 1px solid #f0f1f4; border-radius: 6px; padding: 9px 11px;">両方に値がある item は、統合先の値を残します（34 件中 6 件が該当）。</div>

        <div style="display: flex; align-items: center; justify-content: center; height: 34px; border-radius: 6px; background: #3767a6; color: #fff; font-size: 13px; font-weight: 500;">統合する</div>
      </div>

      <div style="background: #fff; border: 1px solid #e2e4e9; border-radius: 8px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px;">
        <div style="font-size: 12px; font-weight: 700;">表記ゆれの候補</div>
        <div style="display: flex; flex-direction: column; gap: 7px;">
          <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #454b57;">
            <span style="width: 6px; height: 6px; border-radius: 999px; background: #c9a26b; flex-shrink: 0;"></span>
            「可愛い」と「かわいい」
          </div>
          <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #454b57;">
            <span style="width: 6px; height: 6px; border-radius: 999px; background: #c9a26b; flex-shrink: 0;"></span>
            「クール」と「かっこいい」
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":1440,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    function row(name, count, avg, checked, warn, memo) {
      return {
        name: name,
        count: count,
        avg: avg,
        avgPct: avg + '%',
        checked: checked,
        rowBg: checked ? '#f7faff' : '#fff',
        boxBorder: checked ? '1px solid #3767a6' : '1px solid #cdd0d8',
        boxBg: checked ? '#3767a6' : '#fff',
        hasWarn: !!warn,
        memo: memo || 'メモなし',
        memoColor: memo ? '#454b57' : '#c2c7d0'
      };
    }
    return {
      attrs: [
        row('かわいい', 218, 64, true, false, '甘め・丸みのある造形。ゴシック寄りは「上品」に振る'),
        row('可愛い', 34, 58, true, true, ''),
        row('かっこいい', 142, 71, false, false, 'シャープ・メカ寄り。露出とは独立して付ける'),
        row('上品', 88, 52, false, false, ''),
        row('露出', 63, 38, false, false, '公開ワールドで使えるかの目安。60%以上は要注意'),
        row('日常寄り', 104, 66, false, false, '街中で着ていても違和感がないか'),
        row('ネタ枠', 12, 82, false, false, '')
      ]
    };
  }
}
</script>
</body>
</html>
