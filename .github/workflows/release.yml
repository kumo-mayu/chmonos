# 配る zip を組む。tag（v1.0.0 など）を push すると、Releases に下書きとして置く。
#
# GitHub と BOOTH で同じ zip を配る（ここで1回だけ組んだ物）。署名の無い exe は、
# スマート アプリ コントロールと SmartScreen が exe ごとの評判で判定する。
# 組み直すと別の exe になり評判が無くなるので、手元で組み直した物を BOOTH に上げない
# （別の PC で、組み直した配布の形が止められた。docs/feedback/manual-check-2026-10-07.md）。
#
# 下書きにするのは、公開する前に中身を見て確かめるため。公開は人が Releases の画面で押す。
name: release

on:
  push:
    tags: ['v*']
  # 試しに組むだけのとき（下書きは作らず、成果物として残す）
  workflow_dispatch:

permissions:
  contents: write

# 同じ tag の実行を重ねない（重なると、2つが別々の zip を組んで取り合う）。走っている方を止めずに、後の方を待たせる
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      # その tag の Releases が既にあれば、組む前に止める（点検24）。組み直した zip は別の exe になり、
      # 配った物と取り違えるうえ、最後の Releases の作成で衝突して止まるまで気付けなかった。
      # 配り直すときは、Releases にある zip を使う（docs/dev/signing.md）
      - name: 既に配った tag でないか確かめる
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 「無い」と確かめられたときだけ進む（点検26）。認証や通信の失敗まで「無い」と読むと、配った物と別の zip を組んでしまう
          $answer = gh release view '${{ github.ref_name }}' --repo '${{ github.repository }}' 2>&1 | Out-String
          if ($LASTEXITCODE -eq 0) {
            throw "tag ${{ github.ref_name }} の Releases は既にあります。組み直さず、Releases にある zip を使ってください"
          }
          if ($answer -notmatch 'release not found') {
            throw "Releases があるかを確かめられませんでした。組まずに止めます：$answer"
          }
          $global:LASTEXITCODE = 0

      - uses: actions/checkout@v7

      # SDK の版は global.json で固める（後日組み直しても同じ SDK で組むため。10.0.x だと、その日の最新の SDK になった）
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # global.json は、手元で SDK が上がっても組めるよう新しい機能帯へ進むのを許している（rollForward: latestFeature）。
      # 実行環境に新しい SDK が入っていると、それで組まれて別の exe になるので、指定の版で組めるときだけ進む（点検26）
      - name: SDK の版を確かめる
        run: |
          $want = (Get-Content global.json -Raw | ConvertFrom-Json).sdk.version
          $used = dotnet --version
          if ($used -ne $want) { throw "global.json の SDK（$want）ではなく $used で組もうとしています" }

      - name: 版をそろえる
        id: version
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if (-not $version) { throw 'Directory.Build.props に Version が無い' }
          # tag で組むときは、tag と exe の版が食い違わないようにする（設定画面の版と Releases の名前がずれる）
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -ne "v$version") {
            throw "tag（${{ github.ref_name }}）と Directory.Build.props の版（v$version）が違う"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      # 配る物と同じコミットの試験が通ったときだけ組む（点検24：組めても、保存・読み込みの試験が落ちる版を
      # 配る候補にできた）。試験は通信しない決まり（CLAUDE.md）なので、ここでも走らせられる
      - name: 試験
        run: dotnet test -c Release

      - name: 組む
        run: dotnet publish Chmonos.App -c Release -p:PublishProfile=win-x64 -o out/Chmonos-v${{ steps.version.outputs.version }}

      - name: 説明を添えて確かめる
        run: |
          $dir = 'out/Chmonos-v${{ steps.version.outputs.version }}'
          $readme = Get-Content docs/booth/zip-README.txt -Raw -Encoding utf8
          # 決まっていない所が残ったまま配らない（BOOTH の URL など）
          if ('${{ github.ref_type }}' -eq 'tag' -and $readme.Contains('【未定')) { throw 'docs/booth/zip-README.txt に【未定】が残っている' }
          # マニュアルはそのバージョンの印（manual-v<版>。下の段で付ける）を指す。master は開発中の次のバージョンを含むので、
          # 配った zip から開くと、まだ無い動きが書いてある（2026-10-08・ユーザ判断）
          $readme = $readme.Replace('{version}', '${{ steps.version.outputs.version }}')
          if ($readme.Contains('{')) { throw 'docs/booth/zip-README.txt に埋めていない {…} が残っている' }
          # メモ帳でも崩れないよう、改行は CRLF にする
          [IO.File]::WriteAllText("$dir/README.txt", ($readme -replace "`r?`n", "`r`n"), [Text.UTF8Encoding]::new($false))

          # exe だけでは動かない（辞書は assets に置き、exe の隣を探す）。ライセンスの文も配る物に要る
          $expected = @('Chmonos.exe', 'README.txt', 'LICENSE', 'NOTICE', 'THIRD-PARTY-NOTICES.txt',
                        'assets/JMdict_e.gz', 'assets/kanjidic2.xml.gz', 'assets/booth-categories.json', 'assets/README.md')
          $missing = @($expected | Where-Object { -not (Test-Path "$dir/$_") })
          if ($missing.Count -gt 0) { throw "足りない: $($missing -join ', ')" }
          # pdb などが並ぶのは設定が崩れたしるし（1ファイルにまとめていない）
          $extra = @(Get-ChildItem $dir -File | Where-Object { $_.Name -notin $expected })
          if ($extra.Count -gt 0) { throw "余分な物: $($extra.Name -join ', ')" }

          # exe は自己完結で .NET のランタイムを含むので、その許諾文と第三者の表示を THIRD-PARTY-NOTICES.txt に添える。
          # SDK の版を上げるとランタイムの版も変わるので、告知が同梱する版と合っているかを見る（2026-10-08：v1.0.0・v1.1.0 で抜けていた）
          # 同梱した版は、組み立てが書く deps.json の runtimepack の行にある
          $deps = Get-ChildItem Chmonos.App/obj/Release -Recurse -Filter Chmonos.deps.json | Select-Object -First 1
          $found = if ($deps) { Select-String -LiteralPath $deps.FullName -Pattern 'runtimepack\.Microsoft\.NETCore\.App\.Runtime\.win-x64/([0-9.]+)' | Select-Object -First 1 }
          if (-not $found) { throw '同梱したランタイムの版が分からない（Chmonos.deps.json に runtimepack の行が無い）' }
          $runtime = $found.Matches[0].Groups[1].Value
          $notices = Get-Content "$dir/THIRD-PARTY-NOTICES.txt" -Raw -Encoding utf8
          if (-not $notices.Contains(".NET Runtime $runtime")) { throw "THIRD-PARTY-NOTICES.txt に、同梱するランタイム（$runtime）の告知が無い" }
          "同梱するランタイム：$runtime（告知あり）"

      - name: zip にする
        id: zip
        run: |
          $name = 'Chmonos-v${{ steps.version.outputs.version }}'
          # 展開すると1つのフォルダにまとまるよう、フォルダごと入れる
          Compress-Archive -Path "out/$name" -DestinationPath "out/$name.zip"
          $hash = (Get-FileHash "out/$name.zip" -Algorithm SHA256).Hash
          "$hash  $name.zip" | Set-Content "out/$name.zip.sha256" -Encoding ascii
          "SHA256: $hash" >> $env:GITHUB_STEP_SUMMARY
          "name=$name" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.zip.outputs.name }}
          # artifact は zip に包まれて渡るので、中身は配る zip そのもの
          path: |
            out/${{ steps.zip.outputs.name }}.zip
            out/${{ steps.zip.outputs.name }}.zip.sha256

      - name: Releases に下書きを置く
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' 'out/${{ steps.zip.outputs.name }}.zip' 'out/${{ steps.zip.outputs.name }}.zip.sha256' --draft --title 'Chmonos ${{ github.ref_name }}' --notes '（下書き：公開の前に書く）'

      # そのバージョンのマニュアルの印 manual-v<版> を、組んだのと同じコミットに付ける（2026-10-08・ユーザ判断）。
      # Releases の本文と zip の README はここを指す。公開した後にマニュアルの言い方だけを直したときは、この印を動かす（docs/dev/signing.md）。
      # 名前が v で始まらないので、この workflow はもう一度は動かない
      - name: マニュアルの印を付ける
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'manual-${{ github.ref_name }}'
          gh api "repos/${{ github.repository }}/git/refs/tags/$tag" *> $null
          if ($LASTEXITCODE -eq 0) { "印 $tag は既にある（動かさない）"; $global:LASTEXITCODE = 0; exit 0 }
          $global:LASTEXITCODE = 0
          gh api "repos/${{ github.repository }}/git/refs" -f ref="refs/tags/$tag" -f sha='${{ github.sha }}' > $null
          "印 $tag を ${{ github.sha }} に付けた"
